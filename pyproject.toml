[project]
name = "building-mini-llm"
version = "0.2.0"
description = "A small GPT trained from scratch on a single RTX 5060"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.black]
line-length = 120

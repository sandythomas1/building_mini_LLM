[project]
name = "building-mini-llm"
version = "0.3.0"
description = "Single-GPU GPT decoder and masked-language-model encoder training"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.black]
line-length = 120
